# dsh-datascience-demo bundle patch.
#
# Applied as a profile bundle layer (the `dsh.bundle.patch` manifest field)
# over dsh-base. The row is a bare plugin addressed by package name: the host
# half (exports ".") runs in the node process, and the `dsh.client` declaration
# in package.json makes the browser half (exports "./client") load in the web
# GUI.
- insert:
    - id: datascience-demo
      name: 'dsh-datascience-demo'
